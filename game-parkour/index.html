<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开源跑酷 · 开放原子开源基金会</title>
<style>
  /* ================= 基础样式 ================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#12305e 0%,#070d1c 55%,#03060f 100%);
    color:#e8f1ff;
    font-family:"PingFang SC","Microsoft YaHei","HarmonyOS Sans SC",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  .stage{
    position:relative;
    width:min(96vw,1180px);
    aspect-ratio:16/9;
    max-height:94vh;
    border-radius:18px;
    overflow:hidden;
    background:#050b1f;
    box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 0 1px rgba(90,160,255,.22) inset;
  }
  canvas{display:block;width:100%;height:100%}

  /* ================= HUD ================= */
  .hud{
    position:absolute;inset:0;pointer-events:none;
    padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;
    font-variant-numeric:tabular-nums;
    transition:opacity .22s ease;
  }
  /* 覆盖层出现时隐藏 HUD：否则它会透过覆盖层的 backdrop-filter 被糊成一团。
     按钮要一并禁用点击，否则会留下一批看不见却可点的热区。 */
  .stage.overlay .hud{opacity:0}
  .stage.overlay .icon-btn{pointer-events:none}
  .hud-l,.hud-r{display:flex;gap:10px;align-items:center}
  .pill{
    background:rgba(10,22,46,.78);border:1px solid rgba(110,175,255,.28);
    border-radius:999px;padding:7px 16px;font-size:14px;letter-spacing:.5px;
    display:flex;gap:8px;align-items:baseline;
  }
  .pill b{font-size:20px;font-weight:800;color:#7fd4ff}
  .pill span{font-size:12px;color:#9fb6d4}
  .combo{transition:transform .12s ease,opacity .2s ease;opacity:0;transform:scale(.8)}
  .combo.on{opacity:1;transform:scale(1);color:#ffd36e}
  .combo.on b{color:#ffd36e}
  .icon-btn{
    pointer-events:auto;cursor:pointer;
    width:38px;height:38px;border-radius:50%;
    background:rgba(10,22,46,.78);border:1px solid rgba(110,175,255,.28);
    color:#cfe4ff;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:rgba(30,90,175,.55)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;max-width:420px;justify-content:flex-end}
  .chip{
    font-size:12px;padding:4px 10px;border-radius:999px;letter-spacing:.4px;
    border:1px solid transparent;opacity:.35;transition:opacity .25s,transform .25s;
  }
  .chip.got{opacity:1;transform:scale(1.06)}

  /* ================= 覆盖层 ================= */
  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;
    padding:4% 6%;gap:11px;overflow-y:auto;
    background:radial-gradient(700px 460px at 50% 45%,rgba(12,32,70,.78),rgba(3,6,15,.94));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:fadeIn .28s ease;
  }
  /* 内容不满一屏时靠上下 auto 外边距自然居中；内容超长时可滚动，
     且顶部不会被 flex 居中策略裁掉（justify-content:center + overflow 的老毛病） */
  .screen > :first-child{margin-top:auto}
  .screen > :last-child{margin-bottom:auto}
  .screen.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .brand{
    font-size:13px;letter-spacing:4px;color:#8ec6ff;text-transform:uppercase;
    border:1px solid rgba(110,175,255,.42);border-radius:999px;padding:6px 18px;
  }
  h1{font-size:clamp(28px,4.4vw,50px);font-weight:900;letter-spacing:3px;
     background:linear-gradient(92deg,#7fd4ff,#a98bff 55%,#ffb35c);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 6px 24px rgba(90,150,255,.35));}
  .sub{font-size:clamp(14px,1.5vw,17px);color:#b6cdea;line-height:1.9;max-width:760px}
  .slogan{font-size:clamp(14px,1.6vw,19px);letter-spacing:8px;color:#ffd36e;font-weight:700}
  .keys{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .key{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#9fb6d4}
  .key i{
    font-style:normal;font-size:14px;font-weight:700;color:#dcecff;
    border:1px solid rgba(120,180,255,.4);border-bottom-width:3px;
    border-radius:8px;padding:7px 13px;background:rgba(20,42,80,.75);min-width:46px;
  }
  .btn{
    pointer-events:auto;cursor:pointer;border:0;border-radius:999px;
    padding:13px 42px;font-size:16px;font-weight:800;letter-spacing:3px;
    color:#04101f;font-family:inherit;
    background:linear-gradient(92deg,#6fd0ff,#9d8bff);
    box-shadow:0 10px 30px rgba(90,150,255,.4);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(90,150,255,.55)}
  .btn.ghost{
    background:transparent;color:#bcd6f5;border:1px solid rgba(120,180,255,.45);
    box-shadow:none;padding:11px 30px;font-size:13px;letter-spacing:2px;
  }
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
  .stats{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin:4px 0 2px}
  .stat{min-width:92px}
  .stat u{display:block;font-size:12px;color:#9fb6d4;text-decoration:none;letter-spacing:2px}
  .stat b{font-size:clamp(24px,3.2vw,38px);font-weight:900;color:#7fd4ff;font-variant-numeric:tabular-nums}
  .stat.gold b{color:#ffd36e}
  .proj{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .pchip{
    font-size:13px;padding:6px 13px;border-radius:999px;color:#dbeaff;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  }
  .pchip.on{font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
  .tip{font-size:12px;color:#8aa6c8;letter-spacing:1px}

  /* ================= 玩家 ID 输入 ================= */
  .idinput{
    pointer-events:auto;font-family:inherit;outline:none;
    width:min(240px,58vw);padding:12px 20px;
    font-size:15px;letter-spacing:1px;text-align:center;color:#e8f1ff;
    background:rgba(10,22,46,.82);border:1px solid rgba(110,175,255,.35);
    border-radius:999px;transition:border-color .2s,box-shadow .2s;
  }
  .idinput::placeholder{color:#6f89ad;letter-spacing:1px}
  .idinput:focus{border-color:rgba(127,212,255,.8);box-shadow:0 0 0 4px rgba(90,150,255,.16)}

  /* ================= 跳过教学开关 =================
     做成和开始按钮同高的胶囊，紧挨着按钮摆放：它是开局前要做的决定，
     塞在界面最底部的话，小窗口一溢出就滚出可视区了 */
  .chk{
    pointer-events:auto;cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:9px;
    font-size:13px;color:#bcd6f5;letter-spacing:1px;
    background:rgba(10,22,46,.72);border:1px solid rgba(110,175,255,.32);
    border-radius:999px;padding:13px 20px;
    transition:background .2s,border-color .2s,color .2s;
  }
  .chk:hover{background:rgba(30,90,175,.5);border-color:rgba(120,180,255,.6);color:#e8f1ff}
  .chk:has(input:checked){border-color:rgba(127,212,255,.78);color:#7fd4ff;font-weight:700}
  .chk input{width:15px;height:15px;margin:0;accent-color:#6fd0ff;cursor:pointer;flex:none}

  /* ================= 教学提示 ================= */
  .tut{
    /* 贴着画面顶部放：第 2 课那颗高空徽章最高到画布 34.6% 处，提示压到 10% 才不挡视线 */
    position:absolute;left:50%;top:10%;transform:translate(-50%,-10px);
    display:flex;flex-direction:column;align-items:center;gap:11px;
    pointer-events:none;opacity:0;text-align:center;z-index:2;
    transition:opacity .3s ease,transform .3s ease;
  }
  .tut.show{opacity:1;transform:translate(-50%,0)}
  .stage.overlay .tut{opacity:0}          /* 覆盖层出现时让位给界面内容 */
  .tut-step{font-size:12px;letter-spacing:4px;color:#8ec6ff}
  .tut-key{display:flex;gap:10px;align-items:center}
  .tut-key i{
    font-style:normal;font-size:15px;font-weight:800;color:#dcecff;
    border:1px solid rgba(120,180,255,.45);border-bottom-width:3px;
    border-radius:9px;padding:8px 15px;min-width:50px;text-align:center;
    background:rgba(20,42,80,.88);
    animation:keyPulse 1.25s ease-in-out infinite;
  }
  @keyframes keyPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(127,212,255,0)}
    50%{box-shadow:0 0 0 8px rgba(127,212,255,.13)}
  }
  .tut-text{
    font-size:15px;letter-spacing:1px;color:#dbeaff;
    background:rgba(6,14,30,.75);border:1px solid rgba(110,175,255,.24);
    border-radius:999px;padding:8px 20px;
  }

  /* ================= 排行榜 ================= */
  .board{
    width:min(100%,680px);max-height:44vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:7px;padding-right:8px;
    scrollbar-width:thin;scrollbar-color:rgba(110,175,255,.35) transparent;
  }
  .board::-webkit-scrollbar{width:6px}
  .board::-webkit-scrollbar-thumb{background:rgba(110,175,255,.35);border-radius:99px}
  .brow{
    display:grid;grid-template-columns:52px 1fr 100px 84px 116px;
    align-items:center;gap:10px;font-variant-numeric:tabular-nums;
    background:rgba(10,22,46,.6);border:1px solid rgba(110,175,255,.16);
    border-radius:12px;padding:10px 16px;font-size:14px;
    animation:fadeIn .24s ease;
  }
  .brow.head{
    background:transparent;border:0;padding:0 16px 2px;animation:none;
    font-size:12px;letter-spacing:3px;color:#8aa6c8;
  }
  /* 表头复用同一套列结构，但要压掉数据格的加粗与大字号 */
  .brow.head .rk,.brow.head .nm,.brow.head .sc,.brow.head .ds,.brow.head .tm{
    font-weight:400;font-size:12px;color:#8aa6c8;
  }
  .brow.me{border-color:rgba(255,211,110,.72);background:rgba(255,211,110,.10)}
  .brow .rk{font-weight:900;font-size:15px;color:#7fd4ff;text-align:center}
  .brow.r1 .rk{color:#ffd36e}
  .brow.r2 .rk{color:#dbe6f5}
  .brow.r3 .rk{color:#e8a76b}
  .brow .nm{font-weight:700;color:#e8f1ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .sc{font-weight:800;font-size:16px;color:#7fd4ff;text-align:right}
  .brow .ds,.brow .tm{font-size:12px;color:#8aa6c8;text-align:right}
  .board-empty{font-size:14px;color:#8aa6c8;padding:30px 0;letter-spacing:1px}
  @media (max-width:680px){
    .brow{grid-template-columns:40px 1fr 84px 70px;font-size:13px;padding:9px 12px}
    .brow .tm{display:none}
  }

  /* 结算界面的名次条 */
  .rankline{
    font-size:15px;font-weight:800;letter-spacing:3px;color:#ffd36e;
    background:rgba(255,211,110,.10);border:1px solid rgba(255,211,110,.38);
    border-radius:999px;padding:9px 26px;
  }
  .rankline.off{color:#8aa6c8;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.13)}

  /* 舞台较矮时（笔记本小窗、IDE 内嵌预览窗）收掉品牌行并缩紧间距，
     保证 ID 输入框和开始按钮始终落在可视区内，不必滚动去找 */
  @media (max-height:700px){
    .screen{gap:8px}
    #scrStart .brand{display:none}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>

  <!-- ================= 顶部 HUD ================= -->
  <div class="hud">
    <div class="hud-l">
      <div class="pill"><b id="uiScore">0</b><span>分</span></div>
      <div class="pill"><b id="uiDist">0</b><span>米</span></div>
      <div class="pill combo" id="uiCombo"><b>x1</b><span>连击</span></div>
    </div>
    <div class="hud-r">
      <div class="chips" id="uiChips"></div>
      <div class="pill"><b id="uiBest">0</b><span>最高</span></div>
      <button class="icon-btn" id="btnSound" title="音效开关">🔊</button>
      <button class="icon-btn" id="btnPause" title="暂停 (P)">⏸</button>
    </div>
  </div>

  <!-- ================= 教学提示（浮在画布上，不拦截点击） ================= -->
  <div class="tut" id="uiTut">
    <div class="tut-step" id="uiTutStep"></div>
    <div class="tut-key" id="uiTutKey"></div>
    <div class="tut-text" id="uiTutText"></div>
  </div>

  <!-- ================= 开始界面 ================= -->
  <div class="screen show" id="scrStart">
    <div class="brand">OpenAtom Foundation</div>
    <h1>开 源 跑 酷</h1>
    <div class="slogan">共建 · 共治 · 共享</div>
    <div class="sub">沿着「开源之路」奔跑，收集开源项目徽章，跃过技术债、钻过兼容性门槛。</div>
    <div class="proj" id="uiProjStart"></div>
    <div class="keys">
      <div class="key"><i>空格</i>跳跃 / 二段跳</div>
      <div class="key"><i>↓</i>滑铲</div>
      <div class="key"><i>P</i>暂停</div>
    </div>
    <div class="row">
      <input class="idinput" id="uiId" maxlength="12" placeholder="输入你的 ID" autocomplete="off" spellcheck="false">
      <button class="btn ghost" id="btnBoard">排 行 榜</button>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="uiSkipTut">跳过教学</label>
      <button class="btn" id="btnStart">开 始 跑 酷</button>
    </div>
    <div class="tip">手机端：上滑跳跃 · 下滑滑铲 · 输完 ID 按回车即可开局</div>
  </div>

  <!-- ================= 排行榜界面（数据来自本机 localStorage） ================= -->
  <div class="screen" id="scrBoard">
    <div class="brand">本机排行榜</div>
    <h1>排 行 榜</h1>
    <div class="sub" id="boardSub">成绩全部保存在当前浏览器中</div>
    <div class="board" id="uiBoard"></div>
    <div class="row">
      <button class="btn ghost" id="btnBoardBack">返 回</button>
      <button class="btn ghost" id="btnBoardClear">清 空 榜 单</button>
    </div>
  </div>

  <!-- ================= 暂停界面 ================= -->
  <div class="screen" id="scrPause">
    <h1>已 暂 停</h1>
    <div class="sub">休息一下，随时继续。</div>
    <div class="row">
      <button class="btn" id="btnResume">继 续</button>
      <button class="btn ghost" id="btnQuit">重新开始</button>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="uiSkipTutPause">跳过教学</label>
      <button class="btn ghost" id="btnPauseHome">返 回 主 菜 单</button>
    </div>
  </div>

  <!-- ================= 结算界面 ================= -->
  <div class="screen" id="scrOver">
    <div class="brand">本次成绩</div>
    <div class="stats">
      <div class="stat"><u>得 分</u><b id="ovScore">0</b></div>
      <div class="stat"><u>距 离</u><b id="ovDist">0</b></div>
      <div class="stat"><u>项 目</u><b id="ovProj">0</b></div>
      <div class="stat gold"><u>最 高</u><b id="ovBest">0</b></div>
    </div>
    <div class="rankline" id="ovRank">本机排名  未入榜</div>
    <div class="sub" id="ovMsg">继续加油，开源生态由你共建！</div>
    <div class="proj" id="uiProjOver"></div>
    <div class="row">
      <button class="btn" id="btnAgain">再 来 一 次</button>
      <button class="btn ghost" id="btnBoard2">排 行 榜</button>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="uiSkipTutOver">跳过教学</label>
      <button class="btn ghost" id="btnOverHome">返 回 主 菜 单</button>
    </div>
    <div class="tip">按 Enter / R 快速重开</div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   开源跑酷 · 开放原子开源基金会 展示用小游戏
   单文件实现：Canvas 绘制 + Web Audio 音效，无任何外部依赖
   ========================================================================= */

/* ---------------- 1. 常量配置 ---------------- */
const W = 960, H = 540;          // 逻辑画布尺寸
const GROUND = 452;              // 地面基准线的 y 坐标
const GRAV = 2650;               // 重力加速度 px/s²
const JUMP_V = -900;             // 起跳初速度
const JUMP_V2 = -780;            // 二段跳初速度
const SLIDE_TIME = 0.85;         // 滑铲持续时长（秒）：拉长一点，穿闸门的容错更宽
const BODY_H = 84;               // 站立时碰撞盒高度
const SLIDE_BOX_H = 46;          // 滑铲时碰撞盒高度
const GATE_GAP = 56;             // 闸门底沿离地高度：滑铲碰撞盒 46 能钻过，站立 84 会撞
const GATE_TOP = -20;            // 闸门顶部画到画布外，视觉上是「从上方压下来」
const GATE_H = GROUND - GATE_GAP - GATE_TOP;   // 闸门总高，纵向贯穿整个画布
const SPEED_START = 300;         // 开局速度：比原来的 380 更慢，起步更从容
const SPEED_MAX = 820, SPEED_ACC = 9;                   // 速度上限与加速度
const TUT_SPEED = 250;           // 教学段恒定速度，比正常开局再慢一档
const DIFF_TIME = 75;            // 难度爬升到上限所需的秒数
const DIFF_MAX = 1.35;           // 间距最多收紧到 1/1.35
const PLAYER_X = 168;

/* ---------------- 2. 基金会开源项目数据 ----------------
   用于生成可收集徽章，并展示在开始/结算界面 */
const PROJECTS = [
  { key:'openharmony', name:'开源鸿蒙', short:'鸿蒙',  color:'#1E7DFF', tip:'面向万物互联的智能终端操作系统' },
  { key:'openeuler',   name:'开源欧拉', short:'欧拉',  color:'#00C7B7', tip:'面向数字基础设施的操作系统' },
  { key:'openkylin',   name:'openKylin', short:'Kylin', color:'#7B61FF', tip:'开源桌面操作系统' },
  { key:'opentenbase', name:'OpenTenBase',short:'TBase',color:'#F5A623', tip:'企业级分布式数据库' },
  { key:'openloong',   name:'OpenLoong', short:'Loong', color:'#FF6B4A', tip:'人形机器人开源社区' },
  { key:'openlet',     name:'OpenLET',  short:'LET',   color:'#19C37D', tip:'具身智能开源数据集' },
  { key:'tongsuo',     name:'铜锁',     short:'铜锁',  color:'#C9A227', tip:'密码学开源根社区' },
  { key:'atomgit',     name:'AtomGit',  short:'Atom',  color:'#E8453C', tip:'开源 + AI 一体化代码基础设施' }
];
const PROJ_BY_KEY = {};
PROJECTS.forEach(p => PROJ_BY_KEY[p.key] = p);

/* ---------------- 3. 工具函数 ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/** 确定性伪随机，用于生成稳定的背景层 */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 圆角矩形路径（兼容不支持 ctx.roundRect 的浏览器） */
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------------- 3.5 本地存储（玩家 ID 与排行榜） ----------------
   浏览器里没有可直接读写的磁盘文件，localStorage 就是本机的持久化存储。
   它的语义恰好等价于「文件不存在则新建」：键没写过时读取返回 null，
   我们据此返回空榜单，第一次提交成绩时就自动把榜建好。 */
const KEY_BEST  = 'openatom_runner_best';
const KEY_BOARD = 'openatom_runner_board';
const KEY_ID    = 'openatom_runner_id';
const KEY_SKIP  = 'openatom_runner_skip_tut';
const ID_MAX    = 12;            // ID 最大字符数（与输入框 maxlength 保持一致）
// 存储不设条数上限（成绩全部保留），这里只是单次渲染的上限，
// 免得攒了几千条时一次性生成同样多的 DOM 节点把页面卡住
const BOARD_RENDER_MAX = 500;

/** 存储读写全部包一层 try：隐私模式或存储被禁用时 localStorage 会直接抛异常，
    这里降级成「存不下来」而不是让整局游戏崩掉。set 返回是否写成功，
    供 saveBoard 在配额写满时降级 */
const store = {
  get(k, dft) {
    try { const v = localStorage.getItem(k); return v === null ? dft : v; }
    catch (e) { return dft; }
  },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/** 榜单排序：分数降序，同分则先达成者在前 */
function sortBoard(list) {
  return list.sort((a, b) => b.score - a.score || a.time - b.time);
}

/** 按 ID 去重，一个 ID 只留一条。入参必须已排好序，
    这样保留下来的一定是该 ID 的最高分（同分时是最早达成的那局） */
function dedupeById(list) {
  const seen = new Set();
  const out = [];
  for (const e of list) {
    if (seen.has(e.id)) continue;
    seen.add(e.id);
    out.push(e);
  }
  return out;
}

/** 读取榜单：键不存在（首次运行）或内容损坏时返回空榜 */
function loadBoard() {
  const raw = store.get(KEY_BOARD, null);
  if (!raw) return [];
  try {
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    // 逐条清洗，避免手工改坏的数据把整页渲染搞崩
    const rows = arr
      .filter(e => e && typeof e.id === 'string' && Number.isFinite(e.score))
      .map(e => ({
        id: e.id.slice(0, ID_MAX),
        score: Math.max(0, Math.floor(e.score)),
        dist: Math.max(0, Math.floor(e.dist || 0)),
        time: Number.isFinite(e.time) ? e.time : Date.now()
      }));
    // 早期版本的存档里同一个 ID 会留下多条，读取时顺手清洗一遍
    return dedupeById(sortBoard(rows));
  } catch (e) { return []; }
}

/** 写榜：排序、按 ID 去重后全量保存，不限人数 */
function saveBoard(list) {
  let keep = dedupeById(sortBoard(list));
  // 攒到撑爆 localStorage（约 5MB）时对半丢弃靠后的成绩，优先保住高分。
  // 不加这层兜底的话，setItem 会静默失败，玩家这一局就白跑了
  while (!store.set(KEY_BOARD, JSON.stringify(keep)) && keep.length > 1) {
    keep = keep.slice(0, Math.floor(keep.length / 2));
  }
  return keep;
}

/** 提交一条成绩并返回名次（1 起）；未入榜返回 0 */
function submitScore(entry) {
  const ranked = saveBoard(loadBoard().concat(entry));
  // 去重后本局可能没被留下（这个 ID 已有更高分）。此时按 ID 找回他的位次：
  // 上榜的确实是他本人，只是榜上保留的是历史最高分，不该报成「未入榜」
  let idx = ranked.findIndex(e => e.time === entry.time && e.id === entry.id);
  if (idx < 0) idx = ranked.findIndex(e => e.id === entry.id);
  return idx < 0 ? 0 : idx + 1;
}

/** 规范化玩家 ID：折叠空白、截断长度，空值回退成默认名 */
function normalizeId(v) {
  return String(v || '').replace(/\s+/g, ' ').trim().slice(0, ID_MAX) || '匿名开发者';
}

/* ---------------- 4. 画布与自适应缩放 ---------------- */
const cv = document.getElementById('cv');
const stage = document.getElementById('stage');
const ctx = cv.getContext('2d');
let VS = 1, VX = 0, VY = 0;   // 缩放比与居中偏移（设备像素空间）
let canvasReady = false;      // 首次必须无条件计算一次缩放，不能只看尺寸是否相同

/**
 * 让 canvas 后备缓冲始终等于 CSS 尺寸 × dpr。
 * 两者一旦不同步，浏览器就会把低位图拉伸到 CSS 尺寸，画面和文字全会发虚。
 */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  if (r.width < 20 || r.height < 20) return;          // 布局尚未就绪，此时写入会拿到错误尺寸
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (canvasReady && cv.width === w && cv.height === h) return;   // 尺寸未变则跳过，避免无谓重建缓冲
  canvasReady = true;
  cv.width = w; cv.height = h;
  // 等比缩放并居中，保证 960x540 逻辑坐标完整可见；
  // 偏移取整，否则整体落在半像素上会让文字边缘发虚
  VS = Math.min(w / W, h / H);
  VX = Math.round((w - W * VS) / 2);
  VY = Math.round((h - H * VS) / 2);
}
window.addEventListener('resize', resize);
// 内嵌预览窗、分栏拖动等场景不一定触发 window.resize，用 ResizeObserver 兜底
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

/* ---------------- 5. 音效（Web Audio 合成，无音频文件） ---------------- */
let AC = null, muted = false;
function audioCtx() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
/** 播放一个简单的合成音效；kind 决定音色曲线 */
function sfx(kind) {
  if (muted) return;
  const a = audioCtx(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  const P = {
    jump:   { type:'square',   f0:430, f1:780, dur:0.12, vol:0.05 },
    jump2:  { type:'triangle', f0:620, f1:1050, dur:0.14, vol:0.05 },
    slide:  { type:'sawtooth', f0:300, f1:130, dur:0.20, vol:0.04 },
    coin:   { type:'sine',     f0:880, f1:1420, dur:0.16, vol:0.06 },
    power:  { type:'sine',     f0:520, f1:1500, dur:0.35, vol:0.07 },
    hit:    { type:'sawtooth', f0:220, f1:60,  dur:0.42, vol:0.09 },
    shield: { type:'triangle', f0:900, f1:300, dur:0.22, vol:0.06 }
  }[kind];
  if (!P) return;
  o.type = P.type;
  o.frequency.setValueAtTime(P.f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, P.f1), t + P.dur);
  g.gain.setValueAtTime(P.vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + P.dur);
  o.start(t); o.stop(t + P.dur + 0.02);
}

/* ---------------- 6. 背景层预渲染（离屏画布，一次生成反复平铺） ---------------- */
const SKY_SPAN = 1600;   // 远景城市平铺宽度
const MID_SPAN = 1400;   // 中景几何体平铺宽度

/** 远景：城市天际线剪影 */
const skyLayer = (() => {
  const c = document.createElement('canvas');
  c.width = SKY_SPAN; c.height = 260;
  const x = c.getContext('2d');
  const r = mulberry32(20200615);           // 基金会成立日期做种子
  let bx = 0;
  while (bx < SKY_SPAN + 120) {
    const bw = 44 + r() * 92;
    const bh = 60 + r() * 170;
    const base = 260;
    x.fillStyle = '#0d1f3d';
    x.fillRect(bx, base - bh, bw, bh);
    // 楼顶亮边
    x.fillStyle = 'rgba(90,150,255,.22)';
    x.fillRect(bx, base - bh, bw, 2);
    // 随机亮窗
    for (let wy = base - bh + 10; wy < base - 12; wy += 16) {
      for (let wx = bx + 7; wx < bx + bw - 9; wx += 14) {
        if (r() > 0.72) {
          x.fillStyle = r() > 0.5 ? 'rgba(120,200,255,.5)' : 'rgba(255,200,120,.42)';
          x.fillRect(wx, wy, 5, 7);
        }
      }
    }
    bx += bw + 8 + r() * 22;
  }
  return c;
})();

/** 中景：漂浮的六边形与光点，呼应「原子 / 开源」意象 */
const midLayer = (() => {
  const c = document.createElement('canvas');
  c.width = MID_SPAN; c.height = 300;
  const x = c.getContext('2d');
  const r = mulberry32(513);
  for (let i = 0; i < 26; i++) {
    const cx = r() * MID_SPAN, cy = 40 + r() * 200, rad = 8 + r() * 26, rot = r() * Math.PI;
    x.save(); x.translate(cx, cy); x.rotate(rot);
    x.beginPath();
    for (let k = 0; k < 6; k++) {
      const ang = (Math.PI / 3) * k;
      const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      k ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.closePath();
    x.fillStyle = `rgba(80,150,255,${0.05 + r() * 0.07})`;
    x.fill();
    x.strokeStyle = `rgba(120,200,255,${0.10 + r() * 0.16})`;
    x.lineWidth = 1.4;
    x.stroke();
    x.restore();
  }
  return c;
})();

/** 星空（每帧按视差缓慢移动，营造科技氛围） */
const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * W, y: Math.random() * (GROUND - 120),
  r: rand(0.6, 1.8), a: rand(0.2, 0.85), sp: rand(0.15, 0.6)
}));

/* ---------------- 7. 游戏状态 ---------------- */
const g = {
  state: 'ready',        // ready | playing | paused | over
  time: 0, diffT: 0, speed: SPEED_START, dist: 0, bonus: 0, score: 0, diff: 1,
  combo: 0, comboT: 0, mult: 1,
  obstacles: [], badges: [], powers: [], parts: [], toasts: [],
  gapLeft: 600, badgeLeft: 900, powerLeft: 1200,
  bgFar: 0, bgMid: 0, bgNear: 0,
  shake: 0, flash: 0, hitStop: 0,
  collected: new Set()
};
let best = Number(store.get(KEY_BEST, 0) || 0);
let playerId = normalizeId(store.get(KEY_ID, ''));

/* ---------------- 8. 玩家对象 ---------------- */
const player = {
  x: PLAYER_X, y: GROUND - BODY_H, w: 44, h: BODY_H,
  vy: 0, jumps: 0, onGround: true,
  sliding: false, slideT: 0, runPhase: 0,
  shield: 0, invT: 0
};

/** 重置到初始状态 */
function resetGame() {
  Object.assign(g, {
    state: 'playing', time: 0, diffT: 0, speed: SPEED_START,
    dist: 0, bonus: 0, score: 0, diff: 1,
    combo: 0, comboT: 0, mult: 1,
    obstacles: [], badges: [], powers: [], parts: [], toasts: [],
    gapLeft: 620, badgeLeft: 780, powerLeft: 1400,
    bgFar: 0, bgMid: 0, bgNear: 0,
    shake: 0, flash: 0, hitStop: 0
  });
  g.collected = new Set();
  Object.assign(player, {
    x: PLAYER_X, y: GROUND - BODY_H, h: BODY_H, vy: 0, jumps: 0,
    onGround: true, sliding: false, slideT: 0, runPhase: 0, shield: 0, invT: 0
  });
  syncChips();
}

/* ---------------- 9. 玩家动作 ---------------- */
function doJump() {
  if (g.state !== 'playing') return;
  endSlide();                                  // 起跳时先结束滑铲，恢复站立碰撞盒
  if (player.jumps >= 2) return;               // 最多二段跳
  player.vy = player.jumps === 0 ? JUMP_V : JUMP_V2;
  player.jumps++;
  player.onGround = false;
  sfx(player.jumps === 1 ? 'jump' : 'jump2');
  burst(player.x + player.w / 2, player.y + player.h, 8, '#8fd8ff', 150);
}

function doSlide() {
  if (g.state !== 'playing') return;
  if (!player.onGround) { player.vy = Math.max(player.vy, 1100); return; }  // 空中按下滑铲 → 快速下落
  if (player.sliding) { player.slideT = SLIDE_TIME; return; }
  player.sliding = true;
  player.slideT = SLIDE_TIME;
  player.h = SLIDE_BOX_H;
  player.y = GROUND - player.h;
  sfx('slide');
  burst(player.x, GROUND, 10, '#9fb6d8', 120);
}

function endSlide() {
  if (!player.sliding) return;
  player.sliding = false;
  player.h = BODY_H;
  if (player.onGround) player.y = GROUND - BODY_H;
}

/* ---------------- 10. 粒子 / 飘字 ---------------- */
function burst(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.25, spd);
    g.parts.push({
      x, y, vx: Math.cos(a) * s - 60, vy: Math.sin(a) * s - 40,
      life: 0, max: rand(0.28, 0.65), size: rand(1.6, 4.2), color
    });
  }
}
function toast(x, y, text, color) {
  g.toasts.push({ x, y, text, color, life: 0, max: 1.1 });
}

/* ---------------- 11. 实体生成 ---------------- */
/** 生成一个障碍物；类型决定规避方式 */
function spawnObstacle() {
  const t = Math.random();
  let o;
  if (t < 0.46) {
    // 技术债：低矮方块，跳跃即可
    const w = rand(34, 48), h = rand(44, 58);
    o = { type: 'debt', x: W + 60, y: GROUND - h, w, h, label: '技术债' };
  } else if (t < 0.78) {
    // 闭源壁垒：高墙，起跳需更果断
    const w = rand(52, 74), h = rand(92, 112);
    o = { type: 'wall', x: W + 60, y: GROUND - h, w, h, label: '闭源壁垒' };
  } else {
    // 兼容性门槛：纵贯画布的闸门，只留底部一条缝。做这么高是必须的——
    // 二段跳最高能把碰撞盒送到 GROUND-347，矮横杆会被直接飞过去，滑铲就失去了意义
    const w = rand(84, 124);
    o = { type: 'gate', x: W + 60, y: GATE_TOP, w, h: GATE_H, label: '兼容性门槛' };
  }
  g.obstacles.push(o);
  return o;
}

/** 生成一串徽章：直线或弧形（弧形需二段跳） */
function spawnBadges() {
  const arc = Math.random() < 0.45;
  const n = randInt(3, 5);
  const baseX = W + 80;
  const step = 48;
  for (let i = 0; i < n; i++) {
    const p = pick(PROJECTS);
    const k = n > 1 ? i / (n - 1) : 0.5;
    const height = arc ? 60 + Math.sin(Math.PI * k) * 130 : 70;
    g.badges.push({
      proj: p, r: 17, got: false, ph: rand(0, 6.28),
      x: baseX + i * step, y: GROUND - height
    });
  }
  // 避免徽章与障碍物重叠，清理冲突位置的障碍
  const x0 = baseX - 60, x1 = baseX + (n - 1) * step + 60;
  g.obstacles = g.obstacles.filter(o => o.x + o.w < x0 || o.x > x1);
}

/* ---------------- 12. 碰撞检测 ---------------- */
function playerBox() {
  // 碰撞盒略微内缩，手感更宽容
  return { x: player.x + 7, y: player.y + 5, w: player.w - 14, h: player.h - 8 };
}
const overlap = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------------- 13. 每帧更新 ---------------- */
function update(dt) {
  g.time += dt;
  // 速度改成增量式爬升：开局由 resetGame 定为 SPEED_START（教学段则是更慢的 TUT_SPEED），
  // 之后每帧加上 SPEED_ACC 逼近上限。原来是 SPEED_MIN + time*ACC 的绝对公式，
  // 没法表达「教学段用更低的速度起步，结束后无缝接回正常加速」。
  if (!TUT.on) {
    g.speed = Math.min(g.speed + SPEED_ACC * dt, SPEED_MAX);
    g.diffT += dt;
  }
  g.diff = 1 + Math.min(g.diffT / DIFF_TIME, 1) * (DIFF_MAX - 1);   // 难度随存活时间上升
  const move = g.speed * dt;
  if (!TUT.on) g.dist += move;      // 教学段不计距离，HUD 从 0 起步，结束时不会突然跳变

  // 背景视差滚动
  g.bgFar -= move * 0.10;
  g.bgMid -= move * 0.32;
  g.bgNear -= move;

  updatePlayer(dt);
  spawnLogic(dt);
  updateEntities(dt, move);
  tutUpdate(dt);        // 教学推进放在实体移动之后，越界判定才拿得到本帧的坐标
  updateEffects(dt);

  // 连击衰减
  if (g.comboT > 0) {
    g.comboT -= dt;
    if (g.comboT <= 0) { g.combo = 0; g.mult = 1; }
  }

  // 总分 = 距离分 + 徽章分
  g.score = Math.floor(g.dist / 8) + g.bonus;
  syncHUD();
}

/** 玩家物理与状态更新 */
function updatePlayer(dt) {
  player.vy += GRAV * dt;
  player.y += player.vy * dt;

  // 落地判定
  const floorY = GROUND - player.h;
  if (player.y >= floorY) {
    if (!player.onGround) burst(player.x + player.w / 2, GROUND, 7, '#7fa6d6', 110);
    player.y = floorY;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
  }

  // 滑铲计时
  if (player.sliding) {
    player.slideT -= dt;
    if (player.slideT <= 0) endSlide();
    // 滑铲拖尾火花
    if (Math.random() < 0.7) burst(player.x + 4, GROUND - 4, 1, '#c8d8ef', 90);
  }

  // 奔跑动画相位：速度越快摆动越快
  player.runPhase += dt * (6 + g.speed * 0.016);

  // 护盾 / 无敌计时
  if (player.shield > 0) player.shield -= dt;
  if (player.invT > 0) player.invT -= dt;
}

/** 按剩余距离生成障碍与徽章，保证间隙随速度同比例扩大 */
function spawnLogic(dt) {
  const move = g.speed * dt;

  // 教学段的内容全部由教学脚本安排（每课一个样本），不掺随机障碍和道具，
  // 否则新手还没来得及读完提示就会被别的东西撞飞
  if (TUT.on) return;

  g.gapLeft -= move;
  if (g.gapLeft <= 0) {
    const o = spawnObstacle();
    // 间距随难度收紧，但绝不低于「必定可通过」的下限：
    // 一次跳跃滞空约 0.7s，加上障碍自身宽度与反应余量，下限取 speed*0.80 + 120。
    // 闸门要另算：它只能滑铲过，而滑铲（SLIDE_TIME 0.85s）比跳跃滞空更久，
    // 后面不留出恢复距离的话，连来两个闸门就是死局
    const floor = o.type === 'gate' ? g.speed * 0.95 + 160 : g.speed * 0.80 + 120;
    const raw = g.speed * rand(0.82, 1.35) + rand(120, 300);
    g.gapLeft = Math.max(raw / g.diff, floor);
  }

  g.badgeLeft -= move;
  if (g.badgeLeft <= 0) {
    spawnBadges();
    g.badgeLeft = (g.speed * rand(1.5, 2.6) + rand(200, 420)) / g.diff;
  }

  g.powerLeft -= move;
  if (g.powerLeft <= 0) {
    g.powers.push({ x: W + 60, y: GROUND - rand(90, 150), r: 20, ph: 0 });
    g.powerLeft = g.speed * rand(9, 14) + 900;
  }
}

/** 实体位移、碰撞与回收 */
function updateEntities(dt, move) {
  const box = playerBox();
  const canHit = player.invT <= 0;

  // ---- 障碍物 ----
  for (let i = g.obstacles.length - 1; i >= 0; i--) {
    const o = g.obstacles[i];
    o.x -= move;
    if (o.x + o.w < -80) { g.obstacles.splice(i, 1); continue; }

    if (canHit && overlap(box, o)) {
      // 教学障碍撞上不算失败：撞碎它、给一段无敌，稍后把这一课重放一遍，
      // 让玩家在原地把动作练会，而不是被弹回结算界面
      if (o.tut && TUT.on) {
        g.obstacles.splice(i, 1);
        player.invT = 1.0;
        g.shake = 9; g.flash = 0.22;
        sfx('hit');
        burst(o.x + o.w / 2, o.y + o.h / 2, 22, '#ff9db2', 300);
        toast(player.x + 40, player.y - 34, '没关系，再来一次', '#ffd36e');
        TUT.fails++;
        TUT.obj = null;
        TUT.replayT = 0.9;
        continue;
      }
      if (player.shield > 0) {
        // 护盾抵挡一次撞击
        player.shield = 0; player.invT = 1.1;
        sfx('shield'); burst(o.x + o.w / 2, o.y + o.h / 2, 26, '#7ff0d0', 320);
        toast(o.x, o.y - 10, '护盾生效', '#7ff0d0');
        g.obstacles.splice(i, 1);
      } else {
        gameOver(o);
        return;
      }
    }
  }

  // ---- 项目徽章 ----
  for (let i = g.badges.length - 1; i >= 0; i--) {
    const b = g.badges[i];
    b.x -= move;
    b.ph += dt * 3;
    if (b.x < -60) { g.badges.splice(i, 1); continue; }
    // 徽章用圆形判定，收集手感更顺滑
    const cx = b.x, cy = b.y;
    const nx = clamp(cx, box.x, box.x + box.w);
    const ny = clamp(cy, box.y, box.y + box.h);
    const d2 = (nx - cx) ** 2 + (ny - cy) ** 2;
    if (d2 <= (b.r + 2) ** 2) {
      g.badges.splice(i, 1);
      collectBadge(b);
    }
  }

  // ---- 护盾道具 ----
  for (let i = g.powers.length - 1; i >= 0; i--) {
    const p = g.powers[i];
    p.x -= move; p.ph += dt * 4;
    if (p.x < -60) { g.powers.splice(i, 1); continue; }
    const dx = clamp(p.x, box.x, box.x + box.w) - p.x;
    const dy = clamp(p.y, box.y, box.y + box.h) - p.y;
    if (dx * dx + dy * dy <= (p.r + 4) ** 2) {
      g.powers.splice(i, 1);
      player.shield = 6;
      g.bonus += 50;
      sfx('power');
      burst(p.x, p.y, 24, '#7ff0d0', 300);
      toast(p.x, p.y - 16, '开源共建 · 护盾 +6s', '#7ff0d0');
    }
  }
}

/** 收集徽章：累加连击与分数，并高亮对应项目 */
function collectBadge(b) {
  const p = b.proj;
  g.combo++;
  g.comboT = 2.2;
  g.mult = Math.min(1 + Math.floor(g.combo / 3) * 0.5, 4);
  const gain = Math.round(100 * g.mult);
  g.bonus += gain;
  sfx('coin');
  burst(b.x, b.y, 16, p.color, 240);
  toast(b.x, b.y - 18, `${p.name} +${gain}`, p.color);
  if (!g.collected.has(p.key)) {
    g.collected.add(p.key);
    syncChips();
    // 集齐全部项目 → 额外奖励
    if (g.collected.size === PROJECTS.length) {
      g.bonus += 2000;
      toast(player.x + 40, player.y - 30, '生态集齐！+2000', '#ffd36e');
      sfx('power');
    }
  }
}

/** 粒子与飘字更新 */
function updateEffects(dt) {
  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i];
    p.life += dt;
    if (p.life >= p.max) { g.parts.splice(i, 1); continue; }
    p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = g.toasts.length - 1; i >= 0; i--) {
    const t = g.toasts[i];
    t.life += dt; t.y -= 42 * dt;
    if (t.life >= t.max) g.toasts.splice(i, 1);
  }
  g.shake *= Math.pow(0.0015, dt);
  if (g.shake < 0.4) g.shake = 0;
  g.flash *= Math.pow(0.002, dt);
}

/* ---------------- 13.5 教学关卡 ----------------
   参考其他跑酷游戏的开场引导：不弹说明页挡视线，而是按「这个动作会不会」
   拆成三课，每课只放一个必须用该动作通过的样本，越过就进下一课。
   教学段不计成绩、撞到不结束（只重放当前课），做完自动接回正式跑酷。 */
const TUT = {
  on: false,      // 是否处于教学段
  step: 0,        // 1..3 = 三课；4 = 收尾
  replayT: 0,     // 撞到教学障碍后重放当前课的等待计时
  t: 0,           // 收尾倒计时
  fails: 0,       // 当前这一课连着撞了几次
  obj: null,      // 当前课的地面障碍引用
  group: []       // 当前课的徽章组引用
};

const uiTut = document.getElementById('uiTut');
const uiTutStep = document.getElementById('uiTutStep');
const uiTutKey = document.getElementById('uiTutKey');
const uiTutText = document.getElementById('uiTutText');

/** 显示教学提示；keys 传空数组则只留文字说明（收尾提示用） */
function tutHint(keys, text, stepLabel) {
  uiTutStep.textContent = stepLabel || '';
  uiTutStep.style.display = stepLabel ? '' : 'none';
  uiTutKey.textContent = '';
  keys.forEach(k => {
    const i = document.createElement('i');
    i.textContent = k;
    uiTutKey.appendChild(i);
  });
  uiTutKey.style.display = keys.length ? '' : 'none';
  uiTutText.textContent = text;
  uiTut.classList.add('show');
}
function hideTut() { uiTut.classList.remove('show'); }

/** 开跑前放出第一课，并把速度压到教学档 */
function tutBegin() {
  Object.assign(TUT, { on: true, step: 1, replayT: 0, t: 0, fails: 0, obj: null, group: [] });
  g.speed = TUT_SPEED;
  tutLesson();
}

/** 按 TUT.step 放出当前课的样本 */
function tutLesson() {
  TUT.obj = null;
  TUT.group = [];

  if (TUT.step === 1) {
    // 第 1 课 · 跳跃：一个矮障碍，跳过去就行
    const o = { type: 'debt', x: W + 120, y: GROUND - 46, w: 40, h: 46, label: '技术债', tut: 1 };
    g.obstacles.push(o);
    TUT.obj = o;
    tutHint(['空格'], '按 空格 跳过「技术债」', '第 1 / 3 课 · 跳跃');
  } else if (TUT.step === 2) {
    // 第 2 课 · 二段跳：中间那颗徽章放在单跳够不到的高度
    // （单跳最高约 GROUND-232，这里给到 GROUND-265），必须补第二次空格
    const baseX = W + 130;
    for (let i = 0; i < 3; i++) {
      const k = i / 2;
      const b = {
        proj: PROJECTS[i % PROJECTS.length], r: 17, got: false, ph: i * 1.2, tut: 1,
        x: baseX + i * 58, y: GROUND - (70 + Math.sin(Math.PI * k) * 195)
      };
      g.badges.push(b);
      TUT.group.push(b);
    }
    tutHint(['空格', '空格'], '第一次起跳后在空中再按一次 空格，二段跳够到高处徽章', '第 2 / 3 课 · 二段跳');
  } else {
    // 第 3 课 · 滑铲：闸门，尺寸与正式关卡里的「兼容性门槛」完全一致
    const o = { type: 'gate', x: W + 120, y: GATE_TOP, w: 100, h: GATE_H, label: '兼容性门槛', tut: 1 };
    g.obstacles.push(o);
    TUT.obj = o;
    tutHint(['↓'], '按 ↓ 滑铲，从横杆下方钻过去', '第 3 / 3 课 · 滑铲');
  }
}

/** 进入下一课；三课走完转入收尾 */
function tutNext() {
  TUT.step++;
  TUT.fails = 0;                 // 换课就重新计失败次数
  if (TUT.step > 3) {
    TUT.step = 4;
    TUT.t = 1.6;
    TUT.obj = null;
    TUT.group = [];
    tutHint([], '教学结束 · 成绩从这一刻开始计算', '准 备 开 跑');
    return;
  }
  tutLesson();
}

/** 教学主循环：逐课判定是否通过，并处理重放与收尾 */
function tutUpdate(dt) {
  if (!TUT.on) return;

  if (TUT.replayT > 0) {
    TUT.replayT -= dt;
    if (TUT.replayT <= 0) {
      // 同一课连着撞三次，说明玩家还没找到手感（或者人已经走开了）。
      // 直接放行，否则会一直卡在教程里出不去
      if (TUT.fails >= 3) tutNext();
      else tutLesson();
    }
    return;
  }

  if (TUT.step === 1 || TUT.step === 3) {
    // 地面障碍被甩到身后 = 这一课过了
    const o = TUT.obj;
    if (!o || o.x + o.w < player.x - 12) tutNext();
  } else if (TUT.step === 2) {
    // 徽章全部接住、或全部飞过身后都算过：教学阶段不因漏接而卡住玩家
    const alive = TUT.group.filter(b => g.badges.includes(b));
    if (!alive.length || alive.every(b => b.x < player.x - 12)) tutNext();
  } else if (TUT.step === 4) {
    TUT.t -= dt;
    if (TUT.t <= 0) tutFinish();
  }
}

/** 收尾：交还控制权，难度重新计时，成绩从这一刻起算 */
function tutFinish() {
  TUT.on = false;
  TUT.obj = null;
  TUT.group = [];
  hideTut();
  g.diffT = 0;
  sfx('power');
  toast(player.x + 40, player.y - 44, '开始计分！', '#ffd36e');
}

/* ---------------- 14. 绘制 ---------------- */
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(VS, 0, 0, VS, VX, VY);

  // 受击抖动
  ctx.save();
  if (g.shake > 0.4) {
    ctx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  }

  drawSky();
  drawSkyline();
  drawMidLayer();
  drawGround();
  drawBadges();
  drawPowers();
  drawObstacles();
  drawPlayer();
  drawParticles();
  drawToasts();

  if (g.flash > 0.01) {
    ctx.fillStyle = `rgba(255,90,110,${Math.min(g.flash, 0.5)})`;
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }
  ctx.restore();
}

function drawSky() {
  const grd = ctx.createLinearGradient(0, 0, 0, GROUND);
  grd.addColorStop(0, '#04091a');
  grd.addColorStop(0.45, '#0a1834');
  grd.addColorStop(1, '#15325e');
  ctx.fillStyle = grd;
  ctx.fillRect(-40, -40, W + 80, GROUND + 40);

  // 地平线光晕
  const glow = ctx.createRadialGradient(W / 2, GROUND, 20, W / 2, GROUND, 520);
  glow.addColorStop(0, 'rgba(70,150,255,.24)');
  glow.addColorStop(1, 'rgba(70,150,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(-40, 0, W + 80, GROUND);

  // 星点：随距离缓慢左移
  for (const s of stars) {
    const x = ((s.x + g.bgFar * s.sp * 0.5) % W + W) % W;
    ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(g.time * 2 + s.x));
    ctx.fillStyle = '#cfe6ff';
    ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** 平铺绘制一个离屏层两次，实现无缝滚动 */
function tileLayer(img, offset, span, y) {
  let ox = offset % span;
  if (ox > 0) ox -= span;
  for (let x = ox; x < W; x += span) ctx.drawImage(img, x, y);
}

function drawSkyline() {
  tileLayer(skyLayer, g.bgFar, SKY_SPAN, GROUND - 258);
}

function drawMidLayer() {
  ctx.globalAlpha = 0.9;
  tileLayer(midLayer, g.bgMid, MID_SPAN, GROUND - 296);
  ctx.globalAlpha = 1;
}

function drawGround() {
  // 地面主体
  const grd = ctx.createLinearGradient(0, GROUND, 0, H);
  grd.addColorStop(0, '#0b1730');
  grd.addColorStop(1, '#050a16');
  ctx.fillStyle = grd;
  ctx.fillRect(-40, GROUND, W + 80, H - GROUND + 40);

  // 发光地平线
  ctx.save();
  ctx.shadowColor = 'rgba(90,190,255,.85)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#5fd0ff';
  ctx.fillRect(-40, GROUND - 2, W + 80, 2.5);
  ctx.restore();

  // 地面网格：竖向刻度 + 横向流动虚线，强化速度感
  ctx.strokeStyle = 'rgba(90,160,255,.16)';
  ctx.lineWidth = 1;
  const gridStep = 90;
  const startX = -((g.bgNear % gridStep) + gridStep) % gridStep;
  ctx.beginPath();
  for (let x = startX; x < W + gridStep; x += gridStep) {
    ctx.moveTo(x, GROUND + 4);
    ctx.lineTo(x - 60, H);            // 斜向线，暗示透视
  }
  ctx.stroke();

  ctx.fillStyle = 'rgba(120,190,255,.30)';
  const dashStep = 64;
  const dOff = -(((g.bgNear * 1.6) % dashStep) + dashStep) % dashStep;
  for (let x = dOff; x < W + dashStep; x += dashStep) {
    ctx.fillRect(x, GROUND + 22, 28, 3);
    ctx.fillRect(x + 10, GROUND + 48, 18, 2);
  }
}

function drawObstacles() {
  for (const o of g.obstacles) {
    if (o.type === 'gate') {
      const botY = o.y + o.h;                       // 闸门底沿，也就是那条缝的上边

      // 闸门本体：上深下浅，越靠近地面的缝越亮，视线自然被引到底部
      const grd = ctx.createLinearGradient(0, o.y, 0, botY);
      grd.addColorStop(0, '#251b05');
      grd.addColorStop(0.7, '#4a3709');
      grd.addColorStop(1, '#8a6612');
      ctx.fillStyle = grd;
      roundRect(ctx, o.x, o.y, o.w, o.h, 8); ctx.fill();

      // 黄黑警示斜纹。整面铺满 416px 会太花、压住角色，所以压暗透明度
      ctx.save();
      ctx.beginPath(); roundRect(ctx, o.x, o.y, o.w, o.h, 8); ctx.clip();
      ctx.fillStyle = 'rgba(255,190,60,.30)';
      for (let x = o.x - o.h; x < o.x + o.w; x += 22) {
        ctx.save(); ctx.translate(x, o.y); ctx.rotate(Math.PI / 4);
        ctx.fillRect(0, 0, 9, o.h * 1.6); ctx.restore();
      }
      ctx.restore();

      ctx.strokeStyle = '#ffc850'; ctx.lineWidth = 2;
      roundRect(ctx, o.x, o.y, o.w, o.h, 8); ctx.stroke();

      // 底沿压一道发光亮边，明确「只有这条缝能过」
      ctx.save();
      ctx.shadowColor = 'rgba(255,200,80,.9)'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffd36e';
      ctx.fillRect(o.x + 2, botY - 3, o.w - 4, 4);
      ctx.restore();

      // 标注与向下箭头一起贴到底沿附近，玩家视线在下方，摆太高等于是没提示
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,228,168,.96)';
      ctx.font = '700 14px system-ui,sans-serif';
      ctx.fillText(o.label, o.x + o.w / 2, botY - 66);

      ctx.fillStyle = 'rgba(255,220,140,.95)';
      const ax = o.x + o.w / 2, ay = botY - 42;
      ctx.beginPath();
      ctx.moveTo(ax - 9, ay); ctx.lineTo(ax + 9, ay); ctx.lineTo(ax, ay + 12);
      ctx.closePath(); ctx.fill();

      ctx.textAlign = 'left';
      continue;
    }

    // 地面障碍（技术债 / 闭源壁垒）
    const col = o.type === 'debt' ? ['#FF4D6D', '#7a1024'] : ['#B44DFF', '#3d0a6b'];
    const grd = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
    grd.addColorStop(0, col[0]);
    grd.addColorStop(1, col[1]);
    ctx.save();
    ctx.shadowColor = col[0] + 'aa';
    ctx.shadowBlur = 14;
    ctx.fillStyle = grd;
    roundRect(ctx, o.x, o.y, o.w, o.h, 7); ctx.fill();
    ctx.restore();

    // 裂纹纹理
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(o.x + o.w * 0.5, o.y + 8);
    ctx.lineTo(o.x + o.w * 0.32, o.y + o.h * 0.5);
    ctx.lineTo(o.x + o.w * 0.62, o.y + o.h - 8);
    ctx.stroke();

    // 标签加一层深色描边，保证压在城市背景上也读得清
    ctx.font = '700 14px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(4,10,22,.85)';
    ctx.strokeText(o.label, o.x + o.w / 2, o.y - 10);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fillText(o.label, o.x + o.w / 2, o.y - 10);
  }
  ctx.textAlign = 'left';
}

function drawBadges() {
  for (const b of g.badges) {
    const p = b.proj;
    const y = b.y + Math.sin(b.ph) * 4;
    ctx.save();
    ctx.translate(b.x, y);

    // 外发光
    ctx.shadowColor = p.color; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832);
    ctx.fillStyle = 'rgba(6,14,30,.92)'; ctx.fill();

    // 外圈
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = p.color; ctx.stroke();
    ctx.shadowBlur = 0;

    // 旋转虚线圈，增加动感
    ctx.rotate(b.ph * 0.6);
    ctx.setLineDash([5, 7]);
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = p.color + '99';
    ctx.beginPath(); ctx.arc(0, 0, b.r + 5, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(-b.ph * 0.6);

    // 项目短名
    ctx.fillStyle = '#ffffff';
    const cn = /[一-龥]/.test(p.short);
    ctx.font = `800 ${cn ? 15 : 12}px system-ui,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.short, 0, 1);
    ctx.restore();
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawPowers() {
  for (const p of g.powers) {
    const y = p.y + Math.sin(p.ph) * 5;
    ctx.save();
    ctx.translate(p.x, y);
    ctx.shadowColor = '#7ff0d0'; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.2832);
    ctx.fillStyle = 'rgba(10,40,36,.9)'; ctx.fill();
    ctx.lineWidth = 2.6; ctx.strokeStyle = '#7ff0d0'; ctx.stroke();
    ctx.shadowBlur = 0;
    // 盾牌图标
    ctx.fillStyle = '#7ff0d0';
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(8, -5); ctx.lineTo(8, 3);
    ctx.quadraticCurveTo(8, 9, 0, 12);
    ctx.quadraticCurveTo(-8, 9, -8, 3);
    ctx.lineTo(-8, -5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* 开发者配色：连帽衫 + 牛仔 + 眼镜 + 背包 + 笔记本 */
const DEV = {
  skin: '#f7cfa8', skinDark: '#dda87e', hair: '#2a2434',
  hood1: '#5aa9ff', hood2: '#2f6bd8', jeans: '#33477a', shoe: '#eef6ff',
  pack: '#7a5cf0', packDark: '#553fd0',
  lap: '#2b3550', screen: '#7ff0d0', frame: '#1a2338'
};

/** 绘制角色：奔跑 / 跳跃 / 滑铲三种姿态 */
function drawPlayer() {
  // 无敌时闪烁
  if (player.invT > 0 && Math.floor(g.time * 18) % 2 === 0) return;

  const cx = player.x + player.w / 2;
  const feet = player.y + player.h;

  ctx.save();

  // 护盾光环
  if (player.shield > 0) {
    const a = 0.35 + 0.25 * Math.sin(g.time * 8);
    ctx.beginPath();
    ctx.arc(cx, player.y + player.h / 2, player.w * 0.95, 0, 6.2832);
    ctx.strokeStyle = `rgba(127,240,208,${a})`;
    ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = `rgba(127,240,208,${a * 0.16})`; ctx.fill();
  }

  if (player.sliding) drawDevSliding(cx, feet);
  else drawDevRunning(cx, feet);

  // 高速奔跑拖影
  if (g.speed > 560 && Math.random() < 0.6) {
    g.parts.push({
      x: player.x + 2, y: player.y + rand(10, player.h - 6),
      vx: -g.speed * 0.35, vy: rand(-20, 20),
      life: 0, max: 0.32, size: rand(1.4, 3), color: '#7fd4ff'
    });
  }
  ctx.restore();
}

/** 奔跑 / 跳跃姿态：背包在后，腋下夹着笔记本 */
function drawDevRunning(cx, feet) {
  const air = !player.onGround;
  const ph = player.runPhase;
  const bodyTop = player.y + 16;
  const hipY = player.y + 60;

  // ---- 背包（先画＝压在身体后面） ----
  ctx.fillStyle = DEV.packDark;
  roundRect(ctx, cx - 25, bodyTop + 2, 17, 37, 7); ctx.fill();
  ctx.fillStyle = DEV.pack;
  roundRect(ctx, cx - 24, bodyTop + 3, 15, 35, 7); ctx.fill();
  ctx.fillStyle = DEV.packDark;
  roundRect(ctx, cx - 22, bodyTop + 24, 11, 10, 3); ctx.fill();

  // ---- 后手（同样在身体之后） ----
  const back = air ? -1.15 : Math.sin(ph + Math.PI);
  ctx.strokeStyle = DEV.hood2;
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 2, bodyTop + 12);
  ctx.lineTo(cx - 2 + back * 14, bodyTop + 27);
  ctx.stroke();

  // ---- 腿：牛仔裤 + 跑鞋 ----
  const l1 = air ? -0.75 : Math.sin(ph);
  const l2 = air ? 0.75 : Math.sin(ph + Math.PI);
  for (const l of [l1, l2]) {
    const lift = air ? 15 : Math.max(0, l) * 15;
    ctx.strokeStyle = DEV.jeans;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(cx, hipY);
    ctx.lineTo(cx + l * 11, hipY + 14);
    ctx.lineTo(cx + l * 17, feet - lift - 5);
    ctx.stroke();
    ctx.fillStyle = DEV.shoe;
    roundRect(ctx, cx + l * 17 - 5, feet - lift - 8, 15, 8, 4); ctx.fill();
  }

  // ---- 连帽衫躯干 ----
  const grd = ctx.createLinearGradient(0, bodyTop, 0, hipY + 8);
  grd.addColorStop(0, DEV.hood1);
  grd.addColorStop(1, DEV.hood2);
  ctx.fillStyle = grd;
  roundRect(ctx, cx - 17, bodyTop, 34, hipY - bodyTop + 8, 12); ctx.fill();

  // 帽子堆在颈后
  ctx.fillStyle = DEV.hood2;
  roundRect(ctx, cx - 20, bodyTop - 7, 24, 17, 8); ctx.fill();
  // 抽绳
  ctx.strokeStyle = 'rgba(238,246,255,.9)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(cx - 4, bodyTop + 6); ctx.lineTo(cx - 5, bodyTop + 16);
  ctx.moveTo(cx + 3, bodyTop + 6); ctx.lineTo(cx + 4, bodyTop + 16);
  ctx.stroke();

  // 胸前 { } —— 开发者标识
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.font = '800 14px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('{ }', cx, bodyTop + 32);

  // ---- 笔记本：夹在身侧 ----
  ctx.save();
  ctx.translate(cx + 14, bodyTop + 34);
  ctx.rotate(-0.14);
  ctx.fillStyle = DEV.lap;
  roundRect(ctx, -9, -7, 19, 14, 2.5); ctx.fill();
  ctx.fillStyle = DEV.screen;
  roundRect(ctx, -7, -5, 15, 10, 1.5); ctx.fill();
  ctx.restore();

  // ---- 前手：夹住笔记本 ----
  ctx.strokeStyle = DEV.hood1;
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 3, bodyTop + 13);
  ctx.lineTo(cx + 11, bodyTop + 28);
  ctx.stroke();
  ctx.fillStyle = DEV.skin;
  ctx.beginPath(); ctx.arc(cx + 12, bodyTop + 30, 3.6, 0, 6.2832); ctx.fill();

  // ---- 头 ----
  const headY = bodyTop - 13;
  ctx.fillStyle = DEV.skinDark;                 // 脖子
  ctx.fillRect(cx - 3, headY + 7, 7, 9);
  ctx.beginPath(); ctx.arc(cx, headY, 13, 0, 6.2832);
  ctx.fillStyle = DEV.skin; ctx.fill();

  // 头发（覆盖头顶与后脑）
  ctx.beginPath();
  ctx.arc(cx, headY, 13, Math.PI * 1.02, Math.PI * 2.02);
  ctx.closePath();
  ctx.fillStyle = DEV.hair; ctx.fill();

  // 眼镜（侧面只见一片镜片）
  ctx.fillStyle = DEV.frame;
  roundRect(ctx, cx - 2, headY - 5, 14, 10, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(190,225,255,.85)';
  ctx.lineWidth = 1.4;
  roundRect(ctx, cx - 2, headY - 5, 14, 10, 3); ctx.stroke();
  // 镜片反光
  ctx.fillStyle = 'rgba(150,220,255,.5)';
  roundRect(ctx, cx + 1, headY - 3.5, 5, 4, 1.5); ctx.fill();

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/** 滑铲姿态：压低身体、把笔记本护在身前 */
function drawDevSliding(cx, feet) {
  ctx.save();
  ctx.translate(cx, feet);
  ctx.rotate(-0.18);

  // 背包
  ctx.fillStyle = DEV.pack;
  roundRect(ctx, -32, -30, 16, 28, 7); ctx.fill();

  // 前伸的腿（滑铲是脚在前）
  ctx.strokeStyle = DEV.jeans;
  ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(2, -13);
  ctx.lineTo(22, -7);
  ctx.stroke();
  ctx.fillStyle = DEV.shoe;
  roundRect(ctx, 18, -13, 15, 8, 4); ctx.fill();

  // 躯干（压低）
  const grd = ctx.createLinearGradient(0, -32, 0, 0);
  grd.addColorStop(0, DEV.hood1);
  grd.addColorStop(1, DEV.hood2);
  ctx.fillStyle = grd;
  roundRect(ctx, -22, -30, 44, 26, 13); ctx.fill();

  // 斜挎的包带
  ctx.strokeStyle = DEV.packDark;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-14, -28); ctx.lineTo(6, -6); ctx.stroke();

  // 笔记本护在身前
  ctx.save();
  ctx.translate(23, -26);
  ctx.rotate(0.1);
  ctx.fillStyle = DEV.lap;
  roundRect(ctx, -10, -8, 21, 15, 3); ctx.fill();
  ctx.fillStyle = DEV.screen;
  roundRect(ctx, -8, -6, 17, 11, 1.5); ctx.fill();
  ctx.restore();

  // 手
  ctx.strokeStyle = DEV.hood1;
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(8, -18); ctx.lineTo(18, -24); ctx.stroke();

  // 头
  ctx.beginPath(); ctx.arc(13, -36, 12, 0, 6.2832);
  ctx.fillStyle = DEV.skin; ctx.fill();
  // 头发
  ctx.beginPath();
  ctx.arc(13, -36, 12, Math.PI * 1.02, Math.PI * 2.02);
  ctx.closePath();
  ctx.fillStyle = DEV.hair; ctx.fill();
  // 眼镜
  ctx.fillStyle = DEV.frame;
  roundRect(ctx, 12, -40, 13, 9, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(190,225,255,.85)';
  ctx.lineWidth = 1.4;
  roundRect(ctx, 12, -40, 13, 9, 3); ctx.stroke();

  ctx.restore();

  // 滑铲尘迹
  ctx.fillStyle = 'rgba(160,200,255,.30)';
  ctx.fillRect(player.x - 26, GROUND - 8, 30, 3);
}

function drawParticles() {
  for (const p of g.parts) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawToasts() {
  ctx.textAlign = 'center';
  for (const t of g.toasts) {
    const a = 1 - t.life / t.max;
    ctx.globalAlpha = a;
    ctx.font = '800 19px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(4,10,22,.85)';
    ctx.strokeText(t.text, clamp(t.x, 96, W - 96), t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, clamp(t.x, 96, W - 96), t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ---------------- 15. 流程控制 ---------------- */
function startGame() {
  // 取用本次的 ID：留空回退成默认名，同时把输入内容记住，下次打开自动回填
  playerId = normalizeId(uiId.value);
  store.set(KEY_ID, String(uiId.value || '').trim().slice(0, ID_MAX));

  resetGame();
  hideAll();
  blurActive();        // 开局后立即释放按钮焦点，否则空格/回车会重放上一次点击
  audioCtx();

  if (uiSkipTut.checked) { TUT.on = false; hideTut(); }
  else tutBegin();
}
function pauseGame() {
  if (g.state !== 'playing') return;
  g.state = 'paused';
  blurActive();
  showScreen('scrPause');
}
function resumeGame() {
  if (g.state !== 'paused') return;
  g.state = 'playing';
  blurActive();
  hideAll();
  last = performance.now();
}
function gameOver(obj) {
  g.state = 'over';
  TUT.on = false;        // 教学段本身撞不死，这里是防御：任何结束都收起教学提示
  hideTut();
  g.shake = 20; g.flash = 0.55;
  sfx('hit');
  burst(player.x + player.w / 2, player.y + player.h / 2, 40, '#ff6b8a', 420);

  const dist = Math.floor(g.dist / 28);
  const finalScore = g.score;
  const prevBest = best;                 // 先存旧纪录，「新纪录」判定要用它比
  if (finalScore > best) {
    best = finalScore;
    store.set(KEY_BEST, String(best));
  }

  // 写入本机排行榜并取回名次；0 表示没上榜（0 分不入榜）
  const entry = { id: playerId, score: finalScore, dist, time: Date.now() };
  const rank = finalScore > 0 ? submitScore(entry) : 0;

  document.getElementById('ovScore').textContent = finalScore;
  document.getElementById('ovDist').textContent = dist;
  document.getElementById('ovProj').textContent = g.collected.size + '/' + PROJECTS.length;
  document.getElementById('ovBest').textContent = best;

  const rl = document.getElementById('ovRank');
  if (rank > 0) { rl.textContent = '本机排名  第 ' + rank + ' 名'; rl.classList.remove('off'); }
  else { rl.textContent = '本机排名  未入榜'; rl.classList.add('off'); }

  const msg = document.getElementById('ovMsg');
  if (g.collected.size === PROJECTS.length) msg.textContent = '满贯！你收集齐了全部开源项目徽章。';
  else if (finalScore > prevBest) msg.textContent = '新纪录！开源生态的下一程，由你继续推动。';
  else msg.textContent = '继续加油，开源生态由你共建！';

  syncChips();
  setTimeout(() => {
    if (g.state === 'over') showScreen('scrOver');
  }, 620);
}
const SCREENS = ['scrStart', 'scrPause', 'scrOver', 'scrBoard'];
/** 显示指定覆盖层，并给舞台打上 overlay 标记（HUD 随之淡出） */
function showScreen(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.toggle('show', s === id));
  stage.classList.add('overlay');
}
function hideAll() {
  SCREENS.forEach(s => document.getElementById(s).classList.remove('show'));
  stage.classList.remove('overlay');
}

/** 回到主菜单：状态交还给 ready，并清空场上实体。
    覆盖层是半透明的，不清掉的话背后会定格着上一局撞车那一瞬的画面 */
function gotoHome() {
  g.state = 'ready';
  TUT.on = false;
  hideTut();
  g.obstacles = []; g.badges = []; g.powers = []; g.parts = []; g.toasts = [];
  g.shake = 0; g.flash = 0;
  blurActive();          // 释放按钮焦点，否则空格/回车会重放刚才那次点击

}

let lastScore = -1, lastDist = -1, lastCombo = -1;
function syncHUD() {
  const s = g.score;
  if (s !== lastScore) { uiScore.textContent = s; lastScore = s; }
  const d = Math.floor(g.dist / 28);
  if (d !== lastDist) { uiDist.textContent = d; lastDist = d; }
  if (g.combo !== lastCombo) {
    lastCombo = g.combo;
    uiCombo.classList.toggle('on', g.combo >= 2);
    uiCombo.querySelector('b').textContent = 'x' + g.mult.toFixed(1);
  }
  if (uiBest.textContent !== String(best)) uiBest.textContent = best;
}

/** 右上角项目收集进度 */
function syncChips() {
  if (!uiChips.dataset.ready) {
    uiChips.innerHTML = PROJECTS.map(p =>
      `<div class="chip" data-k="${p.key}" data-c="${p.color}" style="color:${p.color};border-color:${p.color}44">${p.short}</div>`
    ).join('');
    uiChips.dataset.ready = '1';
  }
  uiChips.querySelectorAll('.chip').forEach(el => {
    const got = g.collected.has(el.dataset.k);
    el.classList.toggle('got', got);
    // 用 data-c 保存原始十六进制色值，避免 style.color 被规范化后拼接失效
    el.style.background = got ? el.dataset.c + '22' : 'transparent';
  });
}

/* ---------------- 16.5 排行榜渲染 ---------------- */

/** 时间戳 → MM-DD HH:mm */
function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/**
 * 渲染榜单。全程 createElement + textContent 写入：
 * ID 是玩家自由输入的内容，用 innerHTML 拼就等于开了个 XSS 口子。
 * highlightId 命中时高亮那一行（结算后进榜看自己名次用）。按 ID 而不是时间戳高亮：
 * 一个 ID 只留一条，留下的是历史最高分，那一局的 time 未必是本局的
 */
function renderBoard(container, highlightId) {
  container.textContent = '';
  const list = loadBoard();
  uiBoardSub.textContent = '本机已记录 ' + list.length + ' 位开发者，每个 ID 只保留历史最高分';

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'board-empty';
    empty.textContent = '还没有成绩，跑一局就能上榜。';
    container.appendChild(empty);
    return;
  }

  const head = document.createElement('div');
  head.className = 'brow head';
  [['rk', '名次'], ['nm', 'ID'], ['sc', '得分'], ['ds', '距离'], ['tm', '时间']]
    .forEach(([cls, txt]) => {
      const cell = document.createElement('div');
      cell.className = cls;
      cell.textContent = txt;
      head.appendChild(cell);
    });
  container.appendChild(head);

  list.slice(0, BOARD_RENDER_MAX).forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'brow'
      + (i === 0 ? ' r1' : i === 1 ? ' r2' : i === 2 ? ' r3' : '')
      + (highlightId && e.id === highlightId ? ' me' : '');

    [String(i + 1), e.id, String(e.score), e.dist + ' 米', fmtTime(e.time)]
      .forEach((txt, ci) => {
        const cell = document.createElement('div');
        cell.className = ['rk', 'nm', 'sc', 'ds', 'tm'][ci];
        cell.textContent = txt;
        row.appendChild(cell);
      });
    container.appendChild(row);
  });

  if (list.length > BOARD_RENDER_MAX) {
    const more = document.createElement('div');
    more.className = 'board-empty';
    more.textContent = '…… 其余 ' + (list.length - BOARD_RENDER_MAX)
      + ' 位开发者已记录，页面一次最多列出 ' + BOARD_RENDER_MAX + ' 位';
    container.appendChild(more);
  }
}

/* ---------------- 17. 输入处理 ---------------- */
/**
 * 部分内嵌浏览器（IDE 预览窗、Simple Browser、远程桌面投屏）中
 * KeyboardEvent.code 会是空字符串或 'Unidentified'，
 * 此时回退用 e.key 查表归一化，保证空格/回车/方向键仍能被识别。
 */
const KEY_ALIAS = {
  ' ': 'Space', 'Spacebar': 'Space', 'Enter': 'Enter', 'Esc': 'Escape',
  'Up': 'ArrowUp', 'ArrowUp': 'ArrowUp', 'Down': 'ArrowDown', 'ArrowDown': 'ArrowDown',
  'ArrowLeft': 'ArrowLeft', 'ArrowRight': 'ArrowRight',
  'w': 'KeyW', 'W': 'KeyW', 's': 'KeyS', 'S': 'KeyS',
  'p': 'KeyP', 'P': 'KeyP', 'r': 'KeyR', 'R': 'KeyR', 'm': 'KeyM', 'M': 'KeyM'
};
function keyOf(e) {
  if (e.code && e.code !== 'Unidentified') return e.code;
  return KEY_ALIAS[e.key] || e.key || '';
}

const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];
const DOWN_KEYS = ['ArrowDown', 'KeyS'];
const CTRL_KEYS = ['KeyP', 'Escape', 'KeyR', 'KeyM'];

/** 让当前获得焦点的元素失焦，避免空格/回车再次激活按钮 */
function blurActive() {
  const el = document.activeElement;
  if (el && el !== document.body && typeof el.blur === 'function') el.blur();
}

window.addEventListener('keydown', e => {
  // 焦点在输入框 / 勾选框上时完全不接管键盘。否则玩家在 ID 框里按空格会被
  // 下面的 preventDefault 吞掉（打不出空格），还会顺手把游戏开起来
  const el = e.target;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;

  const k = keyOf(e);
  const isJump = JUMP_KEYS.includes(k);
  const isDown = DOWN_KEYS.includes(k);
  if (!isJump && !isDown && !CTRL_KEYS.includes(k)) return;

  // 恒定吞掉这些按键的浏览器默认行为。否则会出现两类故障：
  // 1) 空格滚动页面；
  // 2) 回车/空格「重新点击」仍带焦点的暂停、音效按钮 —— 玩家按跳跃键却把游戏切成暂停，
  //    或者在暂停界面按回车、被恢复后又被补一次点击关回去。
  // 开始/继续/重开都由下面的逻辑直接处理，因此无障碍操作不受影响。
  e.preventDefault();
  if (e.repeat) return;

  if (isJump) {
    if (g.state === 'playing') { doJump(); return; }
    if (g.state === 'paused') { resumeGame(); return; }
    startGame();                                   // ready / over 状态直接开局
    return;
  }
  if (isDown) { doSlide(); return; }

  if (k === 'KeyP' || k === 'Escape') {
    if (g.state === 'playing') pauseGame();
    else if (g.state === 'paused') resumeGame();
    return;
  }
  if (k === 'KeyR' && g.state !== 'playing') { startGame(); return; }
  if (k === 'KeyM') toggleSound();
}, { passive: false });

// 鼠标点击画面 = 跳跃
cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (g.state === 'playing') doJump();
});

// 触屏：上滑跳跃、下滑滑铲、轻点跳跃
let touchY = 0, touchT = 0, touchActed = false;
stage.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchY = t.clientY; touchT = performance.now(); touchActed = false;
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (touchActed || g.state !== 'playing') return;
  const dy = e.touches[0].clientY - touchY;
  if (dy < -34) { doJump(); touchActed = true; }
  else if (dy > 34) { doSlide(); touchActed = true; }
}, { passive: true });
stage.addEventListener('touchend', e => {
  if (touchActed) return;
  const dt = performance.now() - touchT;
  if (dt > 320) return;                      // 长按不触发跳跃
  if (g.state === 'playing') doJump();
}, { passive: true });

/* ---------------- 18. 主循环 ---------------- */
let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);   // 限制单帧步长，防止切后台后瞬移
  last = now;

  if (g.state === 'playing') update(dt);
  else if (g.state === 'over') updateEffects(dt);

  draw();
}

/* ---------------- 19. 启动 ---------------- */
const uiId = document.getElementById('uiId');
const uiSkipTut = document.getElementById('uiSkipTut');

/* 开始页、暂停页、结算页各有一个「跳过教学」开关，三者共享同一份选择：
   在哪个页面改的都算数，下一局开局统一按同一个值走 */
const skipBoxes = [
  uiSkipTut,
  document.getElementById('uiSkipTutPause'),
  document.getElementById('uiSkipTutOver')
];
function setSkipTut(on) {
  skipBoxes.forEach(b => { b.checked = on; });
  store.set(KEY_SKIP, on ? '1' : '0');
  // 暂停时勾上「跳过教学」＝这一局也不想看了，当场结束教学段让成绩开始计分，
  // 省得为了跳过一次教学还专门重开一局
  if (on && TUT.on) tutFinish();
}
skipBoxes.forEach(b => b.addEventListener('change', () => setSkipTut(b.checked)));

// 回填上次用过的 ID 与「跳过教学」选择
uiId.value = store.get(KEY_ID, '');
setSkipTut(store.get(KEY_SKIP, '0') === '1');

// 输完 ID 直接回车开跑（window 上的按键处理已在输入框聚焦时让路）
uiId.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  startGame();
});

showScreen('scrStart');
resize();
buildProjectLists();
syncChips();
syncHUD();
requestAnimationFrame(now => { last = now; loop(now); });
</script>
</body>
</html>
